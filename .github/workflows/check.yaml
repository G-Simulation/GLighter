# Prüfung bei jedem Push und Pull Request: Python übersetzbar, JavaScript gültig, alle Texte auf Deutsch
# und Englisch, Handbuch (App, DOCS.md, docs/) aus denselben Quellen erzeugt, Lizenzprüfung funktioniert,
# Regressionstests der Datenpfade und ein Oberflächen-Rauchtest im Browser.
name: Prüfung

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Python übersetzen
        run: python -m py_compile gaslighter/app/*.py gaslighter/tools/*.py
      - name: JavaScript prüfen
        run: for f in gaslighter/app/web/*.js; do node --check "$f"; done
      - name: Texte de/en vollständig
        working-directory: gaslighter/app/web
        run: node ../../tools/check_i18n.js
      - name: Handbuch aktuell
        run: |
          cd gaslighter && python tools/hb_build.py --docs ../docs && cd ..
          git diff --exit-code -- gaslighter/app/web/hb_inhalt.js gaslighter/DOCS.md docs/ \
            || { echo "::error::Handbuch neu erzeugen: cd gaslighter && python tools/hb_build.py --docs ../docs"; exit 1; }
      - name: Lizenzprüfung (Ed25519, Testvektor RFC 8032)
        working-directory: gaslighter/app
        run: |
          python - <<'PY'
          import lizenz as L
          pub = bytes.fromhex("d75a980182b10ab7d54bfed3c964073a0ee172f3daa62325af021a68f707511a")
          sig = bytes.fromhex("e5564300c360ac729086e2cc806e828a84877f1eb8e5d974d873e065224901555fb8821590a33bacc61e39701cf9b46bd25bf5f0595bbe24655141438e7a100b")
          assert L.ed25519_verify(pub, b"", sig) and not L.ed25519_verify(pub, b"x", sig)
          assert L.check("GL1-AAAAA")["state"] == "invalid" and len(L.PUBLIC_KEY_HEX) == 64
          print("ok")
          PY
      - name: Regressionstests (Tagesdatei, Kette, Home Assistant, Meldungen)
        run: |
          pip install numpy
          cd gaslighter && python -m unittest discover -s tests -v
      - name: Version in config.yaml und laerm.py gleich
        run: |
          a=$(grep -oP '^version: "\K[^"]+' gaslighter/config.yaml); b=$(grep -oP '^VERSION = "\K[^"]+' gaslighter/app/laerm.py)
          echo "config.yaml $a, laerm.py $b"; test "$a" = "$b"

  oberflaeche:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Oberflächen-Rauchtest (Browser)
        run: |
          pip install numpy playwright
          playwright install --with-deps chromium
          cd gaslighter && python tests/smoke_ui.py
